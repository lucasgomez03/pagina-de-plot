    document.addEventListener("DOMContentLoaded", () => {
        const grid = document.getElementById("book-grid");

        const nombresCategorias = {

        };
        const categorias = [...new Set(todosLosLibros.map(libro => libro.categoria).filter(Boolean))].sort();
        const crearFiltro = (categoria, etiqueta, cantidad) => {
            const boton = document.createElement('button');
            boton.type = 'button';
            boton.className = 'filter-btn category-filter-btn';
            boton.dataset.filter = categoria;
            boton.textContent = cantidad === undefined ? etiqueta : `${etiqueta} (${cantidad})`;
            if (categoria === 'all') boton.classList.add('active');
            return boton;
        };
        categoryFilters.appendChild(crearFiltro('all', 'Todos', todosLosLibros.length));
        categorias.forEach(categoria => {
            const cantidad = todosLosLibros.filter(libro => libro.categoria === categoria).length;
            const etiqueta = nombresCategorias[categoria] || categoria.charAt(0).toUpperCase() + categoria.slice(1);
            categoryFilters.appendChild(crearFiltro(categoria, etiqueta, cantidad));
        });
        const filterBtns = document.querySelectorAll(".filter-btn");

        function obtenerLibrosFiltrados() {
            return todosLosLibros.filter(libro => {
                const coincideCategoria = (categoriaActual === 'all' || libro.categoria === categoriaActual);
                const normalizar = texto => String(texto || '')
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .toLocaleLowerCase('es');
                const query = normalizar(textoBusqueda.trim());
                const coincideTexto = query === '' || [libro.titulo, libro.autor, libro.categoria]
                    .some(dato => normalizar(dato).includes(query));
                return coincideCategoria && coincideTexto;
            });
        }

        function renderizar() {
            const filtrados = obtenerLibrosFiltrados();
            const totalPaginas = Math.ceil(filtrados.length / librosPorPagina) || 1;

            if (paginaActual > totalPaginas) {
                paginaActual = 1;
            }

            const inicio = (paginaActual - 1) * librosPorPagina;
            const fin = inicio + librosPorPagina;
            const librosPagina = filtrados.slice(inicio, fin);

            grid.innerHTML = "";

            if (librosPagina.length === 0) {
                grid.innerHTML = `<div class="no-results">No se encontraron libros que coincidan con tu búsqueda.</div>`;
                paginationContainer.innerHTML = "";
                return;
            }

            librosPagina.forEach(libro => {
                const article = document.createElement("article");
                article.className = `book-card ${libro.categoria}`;
                article.setAttribute("data-categoria", libro.categoria);

                const precioFormateado = "$" + libro.precio.toLocaleString("es-AR");
                const catCapitalizada = nombresCategorias[libro.categoria] || libro.categoria.charAt(0).toUpperCase() + libro.categoria.slice(1);

                article.innerHTML = `
                    ${libro.imagen ? `<img src="${libro.imagen}" alt="${libro.titulo}" loading="lazy">` : ''}
                    <h3>${libro.titulo}</h3>
                    <p>${libro.autor}</p>
                    <span>${catCapitalizada}</span>
                    <h4>${precioFormateado}</h4>
                    <button type="button" aria-label="Agregar ${libro.titulo} al carrito">Agregar al carrito</button>
                `;
                grid.appendChild(article);
            });

            renderizarPaginacion(totalPaginas);
        }

        function renderizarPaginacion(totalPaginas) {
            paginationContainer.innerHTML = "";
            if (totalPaginas <= 1) return;

            const btnAnterior = document.createElement("button");
            btnAnterior.className = "pagination-btn";
            btnAnterior.textContent = "« Anterior";
            btnAnterior.disabled = paginaActual === 1;
            btnAnterior.addEventListener("click", () => {
                if (paginaActual > 1) {
                    paginaActual--;
                    renderizar();
                    window.scrollTo({ top: 300, behavior: 'smooth' });
                }
            });
            paginationContainer.appendChild(btnAnterior);

            let startPage = Math.max(1, paginaActual - 2);
            let endPage = Math.min(totalPaginas, paginaActual + 2);

            if (startPage > 1) {
                const btn1 = document.createElement("button");
                btn1.className = "pagination-btn";
                btn1.textContent = "1";
                btn1.addEventListener("click", () => { paginaActual = 1; renderizar(); window.scrollTo({ top: 300, behavior: 'smooth' }); });
                paginationContainer.appendChild(btn1);
                if (startPage > 2) {
                    const span = document.createElement("span");
                    span.textContent = "...";
                    span.style.padding = "0 5px";
                    paginationContainer.appendChild(span);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                const btn = document.createElement("button");
                btn.className = `pagination-btn ${i === paginaActual ? 'active' : ''}`;
                btn.textContent = i;
                btn.addEventListener("click", () => {
                    paginaActual = i;
                    renderizar();
                    window.scrollTo({ top: 300, behavior: 'smooth' });
                });
                paginationContainer.appendChild(btn);
            }

            if (endPage < totalPaginas) {
                if (endPage < totalPaginas - 1) {
                    const span = document.createElement("span");
                    span.textContent = "...";
                    span.style.padding = "0 5px";
                    paginationContainer.appendChild(span);
                }
                const btnLast = document.createElement("button");
                btnLast.className = "pagination-btn";
                btnLast.textContent = totalPaginas;
                btnLast.addEventListener("click", () => { paginaActual = totalPaginas; renderizar(); window.scrollTo({ top: 300, behavior: 'smooth' }); });
                paginationContainer.appendChild(btnLast);
            }

            const btnSiguiente = document.createElement("button");
            btnSiguiente.className = "pagination-btn";
            btnSiguiente.textContent = "Siguiente »";
            btnSiguiente.disabled = paginaActual === totalPaginas;
            btnSiguiente.addEventListener("click", () => {
                if (paginaActual < totalPaginas) {
                    paginaActual++;
                    renderizar();
                    window.scrollTo({ top: 300, behavior: 'smooth' });
                }
            });
            paginationContainer.appendChild(btnSiguiente);
        }

        filterBtns.forEach(btn => {

                filterBtns.forEach(b => b.classList.remove("active"));

        });

        renderizar();
    });

    (function(){
        const hamburgers = document.querySelectorAll('.hamburger');
        hamburgers.forEach(btn => {
            const nav = btn.closest('.nav-container').querySelector('.nav-menu');

            const setOpen = (open) => {
                if(open){
                    nav.classList.add('open');
                    btn.setAttribute('aria-expanded','true');
                } else {
                    nav.classList.remove('open');
                    btn.setAttribute('aria-expanded','false');
                }
            };

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = !nav.classList.contains('open');
                setOpen(isOpen);
            });

            nav.querySelectorAll('a, summary').forEach(el => {
                el.addEventListener('click', () => setOpen(false));
            });

            document.addEventListener('click', (e) => {
                if(!btn.contains(e.target) && !nav.contains(e.target) && nav.classList.contains('open')){
                    setOpen(false);
                }
            });

            document.addEventListener('keydown', (e) => {
                if(e.key === 'Escape' && nav.classList.contains('open')){
                    setOpen(false);
                    btn.focus();
                }
            });
        });
    })();

</script>
</body>
</html>
